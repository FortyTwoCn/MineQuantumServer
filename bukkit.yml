settings:
  allow-end: true
  warn-on-overload: false
  permissions-file: permissions.yml
  update-folder: update
  plugin-profiling: false
  connection-throttle: 4000
  query-plugins: true
  deprecated-verbose: default
  shutdown-message: 服务器关闭
  minimum-api: none
  use-map-color-cache: true
  compatibility:
    allow-old-keys-in-registry: false
    enum-compatibility-mode: false
spawn-limits:
  monsters: 70
  animals: 10
  water-animals: 5
  water-ambient: 20
  water-underground-creature: 5
  axolotls: 5
  ambient: 15
chunk-gc:
  period-in-ticks: 600
ticks-per:
  animal-spawns: 399
  monster-spawns: 9
  water-spawns: 199
  water-ambient-spawns: 399
  water-underground-creature-spawns: 399
  axolotl-spawns: 399
  ambient-spawns: 399
  autosave: 6000
aliases: now-in-commands.yml
